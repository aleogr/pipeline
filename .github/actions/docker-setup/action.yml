name: 'Docker Setup'
description: 'Registry login and QEMU/Buildx for multi-arch builds'
inputs:
  password: { description: 'Registry password', required: true }
  username: { description: 'Registry username', required: true }
  registry: { description: 'Registry URL', required: true }

runs:
  using: composite
  steps:
    - name: Log in to Container Registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
