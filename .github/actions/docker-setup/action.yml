name: 'Docker Setup'
description: 'Registry login and QEMU/Buildx for multi-arch builds'
inputs:
  password: { description: 'Registry password', required: true }
  username: { description: 'Registry username', required: true }
  registry: { description: 'Registry URL', required: true }

runs:
  using: composite
  steps:
    - name: Log in to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
