name: 'Git Setup'
description: 'Checkout and git auth for private repositories'
inputs:
  token:       { description: 'Access token', required: true }
  fetch-depth: { description: 'Fetch depth', required: true }

runs:
  using: composite
  steps:
    - name: Checkout git repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Configure git for private modules
      shell: bash
      run: >
        git config --global
        url."https://x-access-token:${{ inputs.token }}@github.com/".insteadOf
        "https://github.com/"
